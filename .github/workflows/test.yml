name: Test the labscript suite

# Runs harness/suite.py: installs the component repositories at the given refs into a
# virtual environment on each OS and Python version and runs the end-to-end checks.
# Conda is not used; see harness/README.md.

on:
  push:
    paths:
      - 'harness/**'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      refs:
        description: 'Component refs, space-separated: name=[owner/repo@]ref (ref is a branch, tag, commit or pr/N, the pull request merged into the current default branch)'
        default: ''
      pins:
        description: 'Extra pip requirements for every job, space-separated, for example "numpy<2.5"'
        default: ''
      oses:
        description: 'JSON list of runner labels'
        default: '["ubuntu-latest", "windows-latest"]'
      pythons:
        description: 'JSON list of Python versions'
        default: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      qts:
        description: 'JSON list of Qt bindings'
        default: '["PySide6", "PyQt6", "PyQt5"]'
      all_steps:
        description: 'Also run the steps that are skipped by default (the zprocess test suite)'
        type: boolean
        default: false

jobs:
  test:
    name: ${{ matrix.os }} py${{ matrix.python }} ${{ matrix.qt }} ${{ matrix.pins }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Python 3.15 cannot be installed from PyPI until h5py ships wheels for it.
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses || '["ubuntu-latest", "windows-latest"]') }}
        python: ${{ fromJSON(inputs.pythons || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
        qt: ${{ fromJSON(inputs.qts || '["PySide6", "PyQt6", "PyQt5"]') }}
        pins: ['${{ inputs.pins }}']
        include:
          # The master branches do not compile on NumPy 2.5 (labscript #123); this job
          # shows whether anything else has regressed.
          - os: ubuntu-latest
            python: '3.14'
            qt: PySide6
            pins: numpy<2.5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the system libraries that Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0

      - name: Install uv
        run: python -m pip install -q uv

      - name: Clone the components
        shell: bash
        run: python harness/suite.py clone --repos-dir repos ${{ inputs.refs }}

      - name: Install the components
        shell: bash
        env:
          PINS: ${{ matrix.pins }}
        run: |
          args=()
          for pin in $PINS; do
            args+=(--pin "$pin")
          done
          python harness/suite.py install --repos-dir repos --venv venv --qt ${{ matrix.qt }} \
            --python "$(python -c 'import sys; print(sys.executable)')" "${args[@]}"

      - name: Run the checks
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.all_steps }}" = "true" ]; then
            args+=(--all)
          fi
          python harness/suite.py test --venv venv --work work "${args[@]}"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.qt }}${{ matrix.pins && '-pinned' || '' }}
          path: |
            work/logs
            work/report.md
            work/state.json
          if-no-files-found: ignore
